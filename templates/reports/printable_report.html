<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ report_title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            color: #0f172a;
            background-color: #f8fafc;
            padding: 40px;
            margin: 0;
        }
        .report-card {
            background: #ffffff;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 30px rgba(15, 23, 42, 0.04);
            border: 1px solid #e2e8f0;
        }
        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .report-header h1 {
            font-size: 28px;
            font-weight: 800;
            margin: 0 0 8px 0;
            background: linear-gradient(to right, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .company-name {
            font-size: 20px;
            font-weight: 800;
            color: #0f172a;
            text-align: right;
        }
        .meta-info {
            font-size: 13px;
            color: #64748b;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th {
            background: #f1f5f9;
            color: #475569;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 14px 16px;
            text-align: left;
            border-bottom: 2px solid #e2e8f0;
        }
        td {
            padding: 14px 16px;
            font-size: 14px;
            color: #334155;
            border-bottom: 1px solid #e2e8f0;
        }
        tr:nth-child(even) {
            background: #f8fafc;
        }
        .no-print-zone {
            max-width: 1100px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .print-btn {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.15);
            transition: 0.2s;
        }
        .print-btn:hover {
            transform: translateY(-2px);
        }
        .close-btn {
            background: #f1f5f9;
            color: #475569;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        @media print {
            body {
                background: #ffffff;
                padding: 0;
                margin: 0;
            }
            .no-print-zone {
                display: none !important;
            }
            .report-card {
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                max-width: 100% !important;
            }
            .report-header h1 {
                -webkit-text-fill-color: initial !important;
                color: #000000 !important;
            }
            th {
                background: #e2e8f0 !important;
                color: #000000 !important;
                border-bottom: 2px solid #000000 !important;
            }
            td {
                border-bottom: 1px solid #cbd5e1 !important;
            }
        }
    </style>
</head>
<body>

    <div class="no-print-zone">
        <button class="close-btn" onclick="window.close()">← Close Document</button>
        <button class="print-btn" onclick="window.print()">Print Document / Save to PDF</button>
    </div>

    <div class="report-card">
        <div class="report-header">
            <div>
                <h1>{{ report_title }}</h1>
                <div class="meta-info">Generated on: <b>{{ generated_at }}</b></div>
            </div>
            <div class="company-name">
                ZLAGODA<br>
                <span style="font-size: 12px; color: #64748b; font-weight: 400;">Supermarket Management System</span>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    {% for header in headers %}
                    <th>{{ header }}</th>
                    {% endfor %}
                </tr>
            </thead>
            <tbody>
                {% if data %}
                    {% for row in data %}
                    <tr>
                        {% for cell in row %}
                        <td>{{ cell }}</td>
                        {% endfor %}
                    </tr>
                    {% endfor %}
                {% else %}
                    <tr>
                        <td colspan="{{ headers|length }}" style="text-align: center; color: #94a3b8; padding: 40px;">
                            No records found for this report.
                        </td>
                    </tr>
                {% endif %}
            </tbody>
        </table>
    </div>

</body>
</html>
